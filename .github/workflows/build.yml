name: Build APK (Fix Ubuntu 24)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git python3-pip python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libtool autoconf automake pkg-config

    - name: Install Buildozer from Git (RAHASIA ANTI GAGAL)
      run: |
        pip install --upgrade pip
        pip install cython virtualenv
        # Menginstall versi terbaru langsung dari Github untuk Ubuntu 24
        pip install git+https://github.com/kivy/buildozer.git

    - name: Setup Android SDK & Accept Licenses
      run: |
        buildozer init
        echo "y" | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build APK
      run: |
        # "-v" akan menampilkan log lebih detail jika ada error
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
