name: Build APK with Buildozer (Official)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build with Buildozer
      uses: kivy/buildozer-action@v2
      with:
        python-version: '3.9'
        args: android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
