name: Build APK (Fix OOM - Single Arch)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git python3-pip python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libtool libtool-bin autoconf automake pkg-config autoconf-archive

    - name: Cache Android SDK
      uses: actions/cache@v4
      with:
        path: |
          /home/runner/.buildozer
        key: ${{ runner.os }}-buildozer-python3.11-${{ hashFiles('**/buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-python3.11-

    - name: Install Buildozer & Upgrade Cython
      run: |
        pip install --upgrade pip
        pip install cython virtualenv
        pip install git+https://github.com/kivy/buildozer.git

    - name: Build APK (Hanya 1 Arsitektur agar tidak crash)
      run: |
        buildozer init
        # Perintah sakti untuk membatasi hanya build 1 jenis arsitektur (menghemat RAM)
        sed -i 's/android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
